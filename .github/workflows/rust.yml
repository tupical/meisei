name: Rust

# Единственный CI, гоняющий Rust в этом репозитории. Обёртка собирает слои
# из каталогов этого репозитория по path-зависимостям; сабмодулем остаётся
# только daruma/, поэтому чекаут строго с submodules: recursive — без него
# Cargo.toml не находит daruma/crates/*. daruma публичный, так что хватает
# дефолтного GITHUB_TOKEN (PAT не нужен).
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/rust.yml
      - "scripts/ci/**"
      # слои — обычные каталоги (prompts/, migrations/ и пр. — тоже вход
      # сборки); daruma — gitlink, его апдейт не .rs
      - "torii/**"
      - "satori/**"
      - "enma/**"
      - "yatagarasu/**"
      - "fujin/**"
      - "layer-kit/**"
      - "hyakki/**"
      - daruma
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/rust.yml
      - "scripts/ci/**"
      - "torii/**"
      - "satori/**"
      - "enma/**"
      - "yatagarasu/**"
      - "fujin/**"
      - "layer-kit/**"
      - "hyakki/**"
      - daruma
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      # --no-fail-fast обязателен: без него прогон обрывается на первом
      # красном и выдаёт долю набора за полный.
      - name: Test
        run: python3 scripts/ci/test_evidence.py

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meisei-test-evidence/
          if-no-files-found: warn
