[package]
name = "meisei-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 WITH Commons-Clause"
description = "Meisei umbrella: deterministic lineage fixture connecting layer ids down to a Daruma NewPlan"

[lib]
path = "src/lib.rs"

[[bin]]
name = "meisei"
path = "src/bin/meisei.rs"

[dependencies]
# The five maturity layers, wired in pipeline order. They live in this
# repository as ordinary directories (each its own Cargo workspace, finding
# layer-kit as ../layer-kit), so the whole run builds from this checkout
# alone. This crate owns no business logic — it only
# calls the adapters each layer already exposes, threading one object's
# provenance into the next:
#   RawItem (torii) → SensingItem (satori) → Decision (enma)
#   → PlanBrief (yatagarasu) → ActionPacket (fujin) → NewPlan (daruma).
torii       = { path = "torii" }
satori      = { path = "satori" }
enma        = { path = "enma" }
yatagarasu  = { path = "yatagarasu" }
fujin       = { path = "fujin" }

# The terminal layer: only its core domain primitives, consumed read-only —
# `NewPlan` (the §16 handoff target) plus `Actor`/ids.
daruma-domain = { path = "daruma/crates/domain" }
daruma-shared = { path = "daruma/crates/shared" }

serde_json = "1.0"
